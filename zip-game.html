<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日草皮 — 感恩小島</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --grass-uncut:  #c8df90;
  --grass-cut-a:  #7db84e;
  --grass-cut-b:  #6fa842;
  --grass-head-a: #92cc5c;
  --grass-head-b: #82bc50;
  --lawn-border:  #5a9030;
  --lawn-bg:      #b0d075;
  --marker:       #d4700e;
  --marker-done:  #4a8a30;
  --marker-next:  #e04c08;
  --page-bg:      #eef8e0;
  --surface:      #ffffff;
  --text:         #29302f;
  --muted:        #7c8580;
  --sage-deep:    #597568;
  --coral:        #d98b78;
  --gold:         #c2a35a;
  --border:       #d8e8c0;
  --shadow:       0 16px 48px rgba(60,100,30,0.12);
  --radius:       16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  background: var(--page-bg);
  background-image:
    radial-gradient(circle at 15% 60%, rgba(150,200,80,0.18) 0%, transparent 55%),
    radial-gradient(circle at 85% 20%, rgba(120,180,60,0.12) 0%, transparent 45%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 16px 60px;
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
}

/* ── Back link ───────────────────────────────── */
.back-link {
  font-size: 13px;
  color: var(--sage-deep);
  text-decoration: none;
  font-weight: 500;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 4px;
  align-self: flex-start;
}
.back-link:hover { text-decoration: underline; }

/* ── Page visibility ─────────────────────────── */
.page { width: 100%; display: flex; flex-direction: column; align-items: center; }
.page.hidden { display: none; }

/* ═══════════════════════════════════════════════
   PRE-START PAGE
═══════════════════════════════════════════════ */
.prestart-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 36px 40px;
  max-width: 420px;
  width: 100%;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  text-align: center;
  margin-bottom: 20px;
}

.ps-icon { font-size: 48px; line-height: 1; margin-bottom: 10px; }

.ps-title {
  font-size: 24px;
  font-weight: 900;
  color: var(--sage-deep);
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.ps-subtitle {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
}

.ps-date-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  background: var(--page-bg);
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 16px;
}

.ps-diff-badge {
  font-size: 12px;
  background: var(--sage-deep);
  color: white;
  border-radius: 999px;
  padding: 3px 10px;
  font-weight: 500;
}

.ps-rules {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 22px;
}

.ps-rule {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
  text-align: left;
  background: var(--page-bg);
  border-radius: 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
}

/* Nickname */
.nickname-wrap {
  margin-bottom: 22px;
}
.nick-greeting {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 8px;
}
.nick-greeting strong { color: var(--sage-deep); }
.nick-edit-row {
  display: flex;
  gap: 8px;
  justify-content: center;
}
.nick-input {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  outline: none;
  width: 150px;
}
.nick-input:focus { border-color: var(--sage-deep); }
.nick-change-btn {
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  text-decoration: underline;
  margin-left: 6px;
}
.nick-change-btn:hover { color: var(--sage-deep); }

/* Continue warning */
.continue-warning {
  background: #fff8e8;
  border: 1px solid #f0d090;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12px;
  color: #8a6010;
  margin-bottom: 18px;
  text-align: left;
}

/* Start button */
.btn-start {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  background: var(--sage-deep);
  color: white;
  transition: all 180ms;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 6px 20px rgba(89,117,104,0.35);
}
.btn-start:hover {
  background: #4a6357;
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(89,117,104,0.4);
}
.btn-start:active { transform: translateY(0); }

/* History card */
.history-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  max-width: 420px;
  width: 100%;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}

.history-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.history-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.history-row:last-child { border-bottom: none; }
.history-rank { width: 22px; font-weight: 700; color: var(--muted); font-size: 14px; text-align: center; }
.history-date { font-size: 11px; color: var(--muted); }
.history-diff { font-size: 11px; color: var(--muted); background: var(--page-bg); border-radius: 999px; padding: 2px 8px; border: 1px solid var(--border); }
.history-time { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--sage-deep); font-size: 15px; }
.history-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 16px 0; }

/* ═══════════════════════════════════════════════
   PLAYING PAGE
═══════════════════════════════════════════════ */
.playing-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  background: var(--surface);
  border-radius: 12px;
  padding: 12px 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  max-width: 480px;
  width: 100%;
}

.playing-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--sage-deep);
  display: flex;
  align-items: center;
  gap: 6px;
}

.playing-timer {
  font-size: 22px;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  min-width: 5ch;
}

.playing-progress {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}

/* ── Grid (lawn) ─────────────────────────────── */
.grid-outer {
  position: relative;
  background: var(--lawn-bg);
  border: 4px solid var(--lawn-border);
  border-radius: 14px;
  padding: 10px;
  box-shadow:
    0 10px 36px rgba(60,100,30,0.22),
    inset 0 0 0 2px rgba(255,255,255,0.25);
  margin-bottom: 14px;
  cursor: crosshair;
  touch-action: none;
}

.grid { display: grid; gap: 2px; position: relative; }

.path-canvas {
  position: absolute;
  pointer-events: none;
}

/* ── Cell ────────────────────────────────────── */
.cell {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--grass-uncut);
  border-radius: 4px;
  overflow: hidden;
  transition: background 80ms;
}

/* Uncut grass texture: faint vertical blades */
.cell::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    90deg,
    transparent 0px, transparent 5px,
    rgba(60,100,20,0.07) 5px, rgba(60,100,20,0.07) 6px
  );
  pointer-events: none;
}

/* Mowed: diagonal lawn stripes */
.cell.in-path {
  background: repeating-linear-gradient(
    135deg,
    var(--grass-cut-a) 0px, var(--grass-cut-a) 7px,
    var(--grass-cut-b) 7px, var(--grass-cut-b) 14px
  );
}
.cell.in-path::after { display: none; }

/* Current mower head: brighter stripe */
.cell.path-head {
  background: repeating-linear-gradient(
    135deg,
    var(--grass-head-a) 0px, var(--grass-head-a) 7px,
    var(--grass-head-b) 7px, var(--grass-head-b) 14px
  );
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.45);
}
.cell.path-head::after { display: none; }

/* Solved flash */
@keyframes mow-flash {
  0%   { filter: brightness(1.3); }
  100% { filter: brightness(1); }
}
.cell.mow-anim { animation: mow-flash 0.5s ease-out forwards; }

/* Number markers (stakes / flags) */
.cell-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--marker);
  color: white;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  border: 2px solid rgba(255,255,255,0.55);
  box-shadow: 0 2px 8px rgba(0,0,0,0.22);
  pointer-events: none;
  transition: all 180ms;
}
.cell-num.visited {
  background: var(--marker-done);
  transform: scale(0.82);
  box-shadow: none;
}
.cell-num.next-target {
  background: var(--marker-next);
  animation: pulse-marker 0.85s ease-in-out infinite;
}
@keyframes pulse-marker {
  0%,100% { transform: scale(1);    box-shadow: 0 2px 8px  rgba(224,76,8,0.35); }
  50%     { transform: scale(1.14); box-shadow: 0 4px 16px rgba(224,76,8,0.55); }
}

/* ── Controls ────────────────────────────────── */
.playing-controls {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.btn-control {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 10px;
  padding: 9px 18px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  color: var(--sage-deep);
  transition: all 160ms;
}
.btn-control:hover { background: var(--page-bg); transform: translateY(-1px); }
.btn-control:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.playing-hint {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

/* ═══════════════════════════════════════════════
   RESULT PAGE
═══════════════════════════════════════════════ */
.result-card {
  background: var(--surface);
  border-radius: 20px;
  padding: 40px 44px;
  max-width: 400px;
  width: 100%;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  text-align: center;
  margin-bottom: 20px;
}

.result-icon  { font-size: 48px; line-height: 1; margin-bottom: 10px; }
.result-title { font-size: 22px; font-weight: 900; color: var(--sage-deep); margin-bottom: 4px; }
.result-date  { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
.result-time  {
  font-size: 56px;
  font-weight: 900;
  color: var(--coral);
  font-variant-numeric: tabular-nums;
  line-height: 1;
  margin-bottom: 4px;
}
.result-time-label { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.result-rank {
  font-size: 14px;
  color: var(--text);
  background: var(--page-bg);
  border-radius: 10px;
  padding: 10px 18px;
  display: inline-block;
  margin-bottom: 20px;
}
.result-tomorrow {
  font-size: 13px;
  color: var(--muted);
  background: var(--page-bg);
  border-radius: 10px;
  padding: 10px 16px;
}

.global-note {
  max-width: 400px;
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 16px;
  padding: 10px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: rgba(255,255,255,0.5);
}
</style>
</head>
<body>

<a class="back-link" href="index.html">← 感恩小島</a>

<!-- ═══════════════════════════ PRE-START PAGE ═══════════════════════════ -->

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const DIFF_CFG = {
  easy:   { size: 6, numCount: 8,  cellPx: 66,  label: '簡單 6×6' },
  medium: { size: 7, numCount: 7,  cellPx: 58,  label: '普通 7×7' },
  hard:   { size: 8, numCount: 6,  cellPx: 50,  label: '困難 8×8' },
}
const STATE_KEY   = 'zip_lawn_state_v1'
const HISTORY_KEY = 'zip_lawn_history_v1'
const NAME_KEY    = 'zip_player_name'
const HISTORY_MAX = 20
const MEDALS = ['🥇','🥈','🥉']

// ═══════════════════════════════════════════════════════
// SEEDED RNG  ── Mulberry32 + FNV-1a
// ═══════════════════════════════════════════════════════
let rng = () => Math.random()

function makeRng(seed) {
  let s = seed >>> 0
  return () => {
    s = (s + 0x6D2B79F5) >>> 0
    let t = Math.imul(s ^ (s >>> 15), 1 | s)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

function strSeed(str) {
  let h = 2166136261
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i)
    h = Math.imul(h, 16777619)
  }
  return h >>> 0
}

function useSeeded(seed) { rng = makeRng(seed) }
function useDefault()    { rng = () => Math.random() }

// ═══════════════════════════════════════════════════════
// DAILY UTILS
// ═══════════════════════════════════════════════════════
function todayStr() {
  const d = new Date()
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}

function todayLabel() {
  const d = new Date()
  const days = ['日','一','二','三','四','五','六']
  return `${todayStr()}（週${days[d.getDay()]}）`
}

function getDailyDiff() {
  // Deterministic per day: seeded random picks difficulty
  const r = makeRng(strSeed(todayStr() + 'diff'))()
  return r < 0.34 ? 'easy' : r < 0.67 ? 'medium' : 'hard'
}

// ═══════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════
let difficulty   = 'easy'
let gridSize     = 6
let cellPx       = 66
let numbers      = []
let solutionPath = []
let path         = []
let pathSet      = new Set()
let isDrawing    = false
let timerItv     = null
let seconds      = 0
let solved       = false

// ═══════════════════════════════════════════════════════
// HAMILTONIAN PATH GENERATOR  (Warnsdorff + backtrack)
// ═══════════════════════════════════════════════════════
function buildPuzzle() {
  const today = todayStr()
  difficulty   = getDailyDiff()
  const cfg    = DIFF_CFG[difficulty]
  gridSize     = cfg.size
  cellPx       = cfg.cellPx

  useSeeded(strSeed(today + 'puzzle'))
  solutionPath = generateHamiltonianPath(gridSize)
  numbers      = placeNumbers(solutionPath, cfg.numCount)
  useDefault()
}

function generateHamiltonianPath(size) {
  const total = size * size
  const vis   = Array.from({length:size}, () => new Array(size).fill(false))
  const res   = []
  let   ops   = 0
  const DIRS  = [[0,1],[0,-1],[1,0],[-1,0]]

  function free(r, c) {
    return DIRS.reduce((n,[dr,dc]) => {
      const nr=r+dr, nc=c+dc
      return n + (nr>=0&&nr<size&&nc>=0&&nc<size&&!vis[nr][nc] ? 1 : 0)
    }, 0)
  }

  function dfs(r, c) {
    if (++ops > 120000) return false
    vis[r][c] = true; res.push({row:r,col:c})
    if (res.length === total) return true

    const nexts = DIRS
      .map(([dr,dc]) => [r+dr, c+dc])
      .filter(([nr,nc]) => nr>=0&&nr<size&&nc>=0&&nc<size&&!vis[nr][nc])
      .map(([nr,nc]) => ({r:nr,c:nc,w:free(nr,nc)}))
      .sort((a,b) => a.w!==b.w ? a.w-b.w : (rng()<0.5?-1:1))

    for (const {r:nr,c:nc} of nexts) if (dfs(nr,nc)) return true
    vis[r][c] = false; res.pop(); return false
  }

  const corners = [[0,0],[0,size-1],[size-1,0],[size-1,size-1]]
  const others  = []
  for (let r=0;r<size;r++)
    for (let c=0;c<size;c++)
      if (!corners.some(([cr,cc])=>cr===r&&cc===c)) others.push([r,c])
  shuffleArr(others)
  const starts = [...corners, ...others]

  for (const [sr,sc] of starts) {
    ops=0; res.length=0; vis.forEach(r=>r.fill(false))
    if (dfs(sr,sc) && res.length===total) return [...res]
  }

  // Fallback: serpentine
  const fb=[]
  for (let r=0;r<size;r++)
    for (let c=0;c<size;c++)
      fb.push({row:r, col:r%2===0?c:size-1-c})
  return fb
}

function placeNumbers(sol, numCount) {
  const n      = sol.length
  const total  = Math.max(numCount, 2)
  const idxSet = new Set([0, n-1])

  if (total > 2) {
    const step = n / (total - 1)
    for (let i = 1; i < total-1; i++) {
      let idx = Math.round(i * step)
      idx += Math.round((rng()-0.5) * step * 0.4)
      idx = Math.max(1, Math.min(n-2, idx))
      idxSet.add(idx)
    }
  }

  return [...idxSet].sort((a,b)=>a-b)
    .map((idx,i) => ({row:sol[idx].row, col:sol[idx].col, num:i+1}))
}

// ═══════════════════════════════════════════════════════
// PATH LOGIC
// ═══════════════════════════════════════════════════════
function key(r,c) { return r*100+c }
function adj(a,b) { return Math.abs(a.row-b.row)+Math.abs(a.col-b.col)===1 }

function getNum(r,c) {
  const n = numbers.find(n=>n.row===r&&n.col===c)
  return n ? n.num : null
}

function nextTarget() {
  for (const n of numbers) if (!pathSet.has(key(n.row,n.col))) return n.num
  return null
}

function canMove(r,c) {
  if (r<0||r>=gridSize||c<0||c>=gridSize) return false
  if (path.length>0 && !adj(path[path.length-1],{row:r,col:c})) return false
  if (pathSet.has(key(r,c))) {
    if (path.length>=2) { const p=path[path.length-2]; return p.row===r&&p.col===c }
    return false
  }
  const cn=getNum(r,c)
  if (cn!==null) { const nt=nextTarget(); if (nt!==null&&cn!==nt) return false }
  return true
}

function tryMove(r,c) {
  if (solved) return

  // Backtrack
  if (path.length>=2 && path[path.length-2].row===r && path[path.length-2].col===c) {
    const last=path.pop(); pathSet.delete(key(last.row,last.col))
    renderPath(); syncUI(); return
  }

  if (!canMove(r,c)) return
  if (path.length===0 && getNum(r,c)!==1) return

  path.push({row:r,col:c}); pathSet.add(key(r,c))
  renderPath(); syncUI(); checkWin()
}

function checkWin() {
  if (path.length!==gridSize*gridSize) return
  let last=0
  for (const cell of path) {
    const n=getNum(cell.row,cell.col)
    if (n!==null) { if(n!==last+1) return; last=n }
  }
  if (last<numbers.length) return

  solved=true; stopTimer()
  markDailyComplete(seconds)
  saveHistory(seconds)
  animateSolve()
  setTimeout(() => showResult(seconds), 800)
}

// ═══════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════
function renderGrid() {
  const gridEl = document.getElementById('grid')
  const canvas = document.getElementById('pathCanvas')
  const total  = gridSize * gridSize
  const px     = gridSize * cellPx + (gridSize-1) * 2 // gap=2

  gridEl.style.gridTemplateColumns = `repeat(${gridSize},${cellPx}px)`
  gridEl.style.gridTemplateRows    = `repeat(${gridSize},${cellPx}px)`
  gridEl.style.gap = '2px'
  gridEl.innerHTML = ''

  canvas.width  = px; canvas.height = px
  canvas.style.width=px+'px'; canvas.style.height=px+'px'
  // Position canvas accounting for gap layout
  canvas.style.top='10px'; canvas.style.left='10px'

  for (let r=0;r<gridSize;r++) {
    for (let c=0;c<gridSize;c++) {
      const cell = document.createElement('div')
      cell.className='cell'; cell.dataset.row=r; cell.dataset.col=c
      cell.style.width=cellPx+'px'; cell.style.height=cellPx+'px'

      const no=numbers.find(n=>n.row===r&&n.col===c)
      if (no) {
        const badge=document.createElement('div')
        badge.className='cell-num'; badge.textContent=no.num; badge.id=`num-${r}-${c}`
        cell.appendChild(badge)
      }
      gridEl.appendChild(cell)
    }
  }

  document.getElementById('playProgress').textContent = `0 / ${total} 格`

  gridEl.addEventListener('mousedown',  onMouseDown)
  gridEl.addEventListener('mousemove',  onMouseMove)
  gridEl.addEventListener('mouseleave', ()=>{ isDrawing=false })
}

function renderPath() {
  for (let r=0;r<gridSize;r++) {
    for (let c=0;c<gridSize;c++) {
      const el=cEl(r,c); if(!el) continue
      const idx=path.findIndex(p=>p.row===r&&p.col===c)
      el.classList.toggle('in-path',   idx!==-1)
      el.classList.toggle('path-head', idx!==-1&&idx===path.length-1)
    }
  }

  const nt=nextTarget()
  for (const n of numbers) {
    const b=document.getElementById(`num-${n.row}-${n.col}`); if(!b) continue
    const vis=pathSet.has(key(n.row,n.col))
    b.classList.toggle('visited',     vis)
    b.classList.toggle('next-target', !vis&&n.num===nt)
  }

  drawCanvas()
}

function drawCanvas() {
  const canvas=document.getElementById('pathCanvas')
  const ctx=canvas.getContext('2d')
  // Cell centers accounting for 2px gap
  const stride = cellPx + 2
  const cx = cell => cell.col * stride + cellPx/2
  const cy = cell => cell.row * stride + cellPx/2

  ctx.clearRect(0,0,canvas.width,canvas.height)
  if (path.length<1) return

  if (path.length>=2) {
    ctx.lineCap='round'; ctx.lineJoin='round'
    ctx.lineWidth=cellPx*0.3
    ctx.strokeStyle='rgba(50,90,25,0.3)'
    ctx.beginPath()
    ctx.moveTo(cx(path[0]),cy(path[0]))
    for (let i=1;i<path.length;i++) ctx.lineTo(cx(path[i]),cy(path[i]))
    ctx.stroke()
  }

  // Head dot
  const head=path[path.length-1]
  ctx.fillStyle='rgba(80,140,40,0.55)'
  ctx.beginPath()
  ctx.arc(cx(head),cy(head),cellPx*0.17,0,Math.PI*2)
  ctx.fill()
}

function animateSolve() {
  for (let r=0;r<gridSize;r++)
    for (let c=0;c<gridSize;c++) {
      const el=cEl(r,c); if(!el) continue
      setTimeout(()=>{
        el.classList.add('mow-anim')
        setTimeout(()=>el.classList.remove('mow-anim'),600)
      },(r+c)*20)
    }
}

// ═══════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════
function startTimer() {
  seconds=0
  timerItv=setInterval(()=>{ seconds++; updateTimerEl() },1000)
}
function stopTimer()  { clearInterval(timerItv); timerItv=null }
function updateTimerEl() { document.getElementById('playTimer').textContent=fmt(seconds) }
function fmt(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}` }

// ═══════════════════════════════════════════════════════
// DAILY STATE STORAGE
// ═══════════════════════════════════════════════════════
function loadState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY)||'{}') } catch { return {} }
}
function getTodayRec()  { return loadState()[todayStr()] || null }

function markDailyStart() {
  const s=loadState(); const t=todayStr()
  if (!s[t]) s[t]={ diff:difficulty, started:true, completed:false, time:null }
  localStorage.setItem(STATE_KEY, JSON.stringify(s))
}

function markDailyComplete(time) {
  const s=loadState(); const t=todayStr()
  if (!s[t]) s[t]={ diff:difficulty }
  s[t].completed=true
  if (s[t].time==null || s[t].time>time) s[t].time=time
  // Prune > 60 days
  const cutoff=new Date(); cutoff.setDate(cutoff.getDate()-60)
  for (const d of Object.keys(s)) if (new Date(d)<cutoff) delete s[d]
  localStorage.setItem(STATE_KEY, JSON.stringify(s))
}

// ═══════════════════════════════════════════════════════
// HISTORY (personal leaderboard)
// ═══════════════════════════════════════════════════════
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]') } catch { return [] }
}

function saveHistory(time) {
  const h = loadHistory()
  const today = todayStr()
  // Update if exists today, otherwise insert
  const existing = h.findIndex(e => e.date === today)
  const entry = { date:today, diff:difficulty, label:DIFF_CFG[difficulty].label, time, name:getPlayerName() }
  if (existing>=0) { if (h[existing].time>time) h[existing]=entry }
  else             { h.unshift(entry) }
  if (h.length>HISTORY_MAX) h.length=HISTORY_MAX
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h))
}

function renderHistory(elId) {
  const h   = loadHistory()
  const el  = document.getElementById(elId)
  if (h.length===0) { el.innerHTML='<div class="history-empty">尚無紀錄，快來修第一片草皮！</div>'; return }
  el.innerHTML = h.map((e,i)=>`
    <div class="history-row">
      <div class="history-rank">${MEDALS[i]||`#${i+1}`}</div>
      <span class="history-diff">${e.label}</span>
      <span class="history-date">${e.date}</span>
      <span class="history-time">${fmt(e.time)}</span>
    </div>
  `).join('')
}

// ═══════════════════════════════════════════════════════
// NICKNAME
// ═══════════════════════════════════════════════════════
function getPlayerName() { return localStorage.getItem(NAME_KEY) || '草皮玩家' }
function setPlayerName(n) { localStorage.setItem(NAME_KEY, n.trim() || '草皮玩家') }

function renderNickname() {
  const name = getPlayerName()
  const el   = document.getElementById('nickGreeting')
  el.innerHTML = `嗨，<strong>${name}</strong>！ <button class="nick-change-btn" id="btnChangeName">改名字</button>`
  document.getElementById('btnChangeName').addEventListener('click', ()=>{
    document.getElementById('nickEditArea').classList.remove('hidden')
    document.getElementById('nickInput').value = name
    document.getElementById('nickInput').focus()
  })
}

// ═══════════════════════════════════════════════════════
// PAGE TRANSITIONS
// ═══════════════════════════════════════════════════════
function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'))
  document.getElementById(id).classList.remove('hidden')
}

function goPrestart() {
  const today    = todayStr()
  const diff     = getDailyDiff()
  const cfg      = DIFF_CFG[diff]
  const rec      = getTodayRec()

  document.getElementById('psDate').textContent     = todayLabel()
  document.getElementById('psDiffBadge').textContent = cfg.label

  renderNickname()
  renderHistory('historyListPre')

  if (rec && rec.started && !rec.completed) {
    document.getElementById('continueWarning').classList.remove('hidden')
    document.getElementById('btnStart').textContent = '🚜 繼續修剪！'
  } else {
    document.getElementById('continueWarning').classList.add('hidden')
    document.getElementById('btnStart').textContent = '🚜 拿起割草機，開始！'
  }

  showPage('pagePrestart')
}

function startPlaying() {
  markDailyStart()
  buildPuzzle()
  path=[]; pathSet=new Set(); solved=false; seconds=0

  renderGrid()
  renderPath()
  syncUI()
  showPage('pagePlaying')
  startTimer()
}

function showResult(time) {
  const cfg  = DIFF_CFG[difficulty]
  const h    = loadHistory()
  const rank = h.findIndex(e => e.date===todayStr()) + 1

  document.getElementById('resultDate').textContent  = `${todayLabel()} · ${cfg.label}`
  document.getElementById('resultTime').textContent  = fmt(time)

  const rankEl = document.getElementById('resultRank')
  if (rank===1)    rankEl.innerHTML = '🏆 歷史最佳！'
  else if (rank>0) rankEl.innerHTML = `個人紀錄排名：第 <strong>${rank}</strong> 名`
  else             rankEl.textContent = '完成！'

  renderHistory('historyListResult')
  showPage('pageResult')
}

function showAlreadyDone() {
  const rec = getTodayRec()
  const cfg = DIFF_CFG[rec.diff || getDailyDiff()]

  document.getElementById('resultTitle').textContent  = '今日草皮已修剪完畢 ✅'
  document.getElementById('resultDate').textContent   = `${todayLabel()} · ${cfg.label}`
  document.getElementById('resultTime').textContent   = fmt(rec.time)
  document.getElementById('resultRank').textContent   = '明天再來挑戰新的草皮！'

  renderHistory('historyListResult')
  showPage('pageResult')
}

// ═══════════════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════════════
function cEl(r,c) { return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`) }

function cellAt(clientX, clientY) {
  const el = document.elementFromPoint(clientX, clientY)
  if (!el) return null
  const c = el.closest('.cell')
  if (!c) return null
  return {row: parseInt(c.dataset.row), col: parseInt(c.dataset.col)}
}

function onMouseDown(e) {
  e.preventDefault(); isDrawing=true
  const c=cellAt(e.clientX,e.clientY); if(!c) return
  if (path.length>0 && getNum(c.row,c.col)===1) { resetPath(); return }
  tryMove(c.row,c.col)
}
function onMouseMove(e) {
  if (!isDrawing) return
  const c=cellAt(e.clientX,e.clientY); if(c) tryMove(c.row,c.col)
}

const gridOuter = document.getElementById('gridOuter')
gridOuter.addEventListener('touchstart', e=>{
  e.preventDefault(); isDrawing=true
  const t=e.touches[0]; const c=cellAt(t.clientX,t.clientY); if(!c) return
  if (path.length>0 && getNum(c.row,c.col)===1) { resetPath(); return }
  tryMove(c.row,c.col)
},{passive:false})
gridOuter.addEventListener('touchmove', e=>{
  e.preventDefault(); if (!isDrawing) return
  const t=e.touches[0]; const c=cellAt(t.clientX,t.clientY); if(c) tryMove(c.row,c.col)
},{passive:false})
gridOuter.addEventListener('touchend',  ()=>{ isDrawing=false })
document.addEventListener('mouseup',    ()=>{ isDrawing=false })

function resetPath() {
  path=[]; pathSet=new Set()
  renderPath(); syncUI()
}

function syncUI() {
  document.getElementById('btnUndo').disabled = path.length===0
  document.getElementById('playProgress').textContent = `${path.length} / ${gridSize*gridSize} 格`
}

function shuffleArr(arr) {
  for (let i=arr.length-1;i>0;i--) {
    const j=Math.floor(rng()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]]
  }
}

// ═══════════════════════════════════════════════════════
// WIRE UP
// ═══════════════════════════════════════════════════════

document.getElementById('btnStart').addEventListener('click', startPlaying)

document.getElementById('btnUndo').addEventListener('click', ()=>{
  if (path.length===0) return
  const last=path.pop(); pathSet.delete(key(last.row,last.col))
  renderPath(); syncUI()
})

document.getElementById('btnReset').addEventListener('click', resetPath)

document.getElementById('btnSaveName').addEventListener('click', ()=>{
  const v = document.getElementById('nickInput').value.trim()
  if (v) { setPlayerName(v); renderNickname() }
  document.getElementById('nickEditArea').classList.add('hidden')
})

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
(function init() {
  const rec = getTodayRec()
  if (rec && rec.completed) {
    showAlreadyDone()
  } else {
    goPrestart()
  }
})()
</script>
